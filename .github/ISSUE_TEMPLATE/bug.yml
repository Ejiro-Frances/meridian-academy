name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /admissions
        2. Set boarding to Day
        3. ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
  - type: input
    id: browser
    attributes:
      label: Browser and device
